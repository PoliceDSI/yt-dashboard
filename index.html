<script>
const D=JSON.parse(document.getElementById('data').textContent);const S=D.cur;const K=S.kpi;const DL=D.deltas;
const fmt=n=>n==null?'—':n>=1e8?(n/1e8).toFixed(2)+'억':n>=1e4?(n/1e4).toFixed(n>=1e6?0:1)+'만':n>=1e3?(n/1e3).toFixed(1)+'천':String(Math.round(n));
const num=n=>n==null?'—':Math.round(n).toLocaleString('ko-KR');const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sign=n=>n==null?'':(n>0?'▲ +':n<0?'▼ ':'— ')+num(n);const cls=n=>n==null?'flat':n>0?'up':n<0?'down':'flat';
document.getElementById('chname').textContent=D.channel_name;document.getElementById('readat').innerHTML='YouTube 스튜디오 · 읽은 시각 '+S.read_at.replace('T',' ')+(D.prev_date?'<br>비교 기준: 전날 스냅샷 '+D.prev_date:'<br>첫 스냅샷 · 내일부터 어제 대비가 표시됩니다')+' · 스냅샷 '+D.snapshot_count+'장';
function spark(vals,color){const v=vals.filter(x=>x!=null);if(v.length<2)return '';const W=90,H=34,mn=Math.min(...v),mx=Math.max(...v);const x=i=>i*(W-2)/(v.length-1)+1,y=n=>H-2-(mx===mn?H/2:(n-mn)/(mx-mn)*(H-4));return `<svg class=spark viewBox="0 0 ${W} ${H}"><path d="M`+v.map((n,i)=>x(i)+','+y(n)).join(' L')+`" fill="none" stroke="${color}" stroke-width="1.5"/><circle cx="${x(v.length-1)}" cy="${y(v[v.length-1])}" r="2" fill="${color}"/></svg>`}
const H=D.history;
const kp=[['구독자',num(K.subs),DL.subs,'어제 대비',H.map(h=>h.subs)],['총 조회수',fmt(K.views_total),DL.views_total,'어제 대비',H.map(h=>h.views)],['총 시청 시간',fmt(K.watch_hours_total)+'시간',DL.watch_hours_total,'어제 대비',null],['28일 조회수',fmt(K.views_28d),DL.views_28d,'어제 대비 (28일 창 이동)',H.map(h=>h.v28)],['48시간 조회수',num(K.views_48h),DL.views_48h,'어제 같은 시각 대비',H.map(h=>h.v48)],['월간 시청자',fmt(K.monthly_viewers),DL.monthly_viewers,'어제 대비',null]];
document.getElementById('kpis').innerHTML=kp.map(k=>`<div class=kpi>${k[4]?spark(k[4],'#f5c400'):''}<span>${k[0]}</span><b>${k[1]}</b><span class="delta ${cls(k[2])}">${k[2]==null?(D.prev_date?'변화 없음':'내일부터 표시'):sign(k[2])} <small style="color:#5c6572">${k[2]==null?'':k[3]}</small></span></div>`).join('');
// 어제 대비 도식
(function(){const el=document.getElementById('diff');if(!D.prev_date){el.innerHTML='<h2>어제 대비</h2><p class=empty>첫 스냅샷입니다. 내일 07:30 부터 이 자리에 "무엇이 늘고 줄었는지"가 그려집니다.</p>';return;}
const gainTot=D.movers.reduce((a,m)=>a+Math.max(m.gain,0),0);const top=D.movers.slice(0,6);const mx=Math.max(...top.map(m=>m.gain),1);
let s=`<h2>어제 대비 · ${D.prev_date} → ${S.date}</h2><div class=grid><div><div style="font-size:13px;color:#8b93a1;margin-bottom:6px">하루 동안 가장 많이 본 영상 (조회수 증가분)</div>`;
s+=top.map(m=>`<div class=mover><div><span class="tag ${m.kind}">${m.kind==='short'?'쇼츠':'롱폼'}</span> ${esc(m.title)}<br><small>${m.date} · 누적 ${num(m.views)}</small><div class=bar style="margin-top:4px"><i style="width:${m.gain/mx*100}%"></i></div></div><div class="g up">+${num(m.gain)}<br><small>댓글 +${num(m.cgain)}</small></div></div>`).join('');

s+=`<div><div style="font-size:13px;color:#8b93a1;margin-bottom:6px">새로 올라온 영상</div>`+(D.new_videos.length?D.new_videos.map(v=>`<div class=mover><div><span class="tag new">NEW</span> <span class="tag ${v.kind}">${v.kind==='short'?'쇼츠':'롱폼'}</span> ${esc(v.title)}<br><small>${v.date} · ${v.dur}</small></div><div class=g>${num(v.views)}<br><small>첫날 조회</small></div></div>`).join(''):'<p class=empty>어제 이후 새 영상 없음</p>')

function drawDaily(range){const ex={};D.exact_daily.forEach(e=>ex[e.d]=e.v);let all=(D.approx_daily||[]).map(a=>({d:a.d,v:ex[a.d]!=null?ex[a.d]:a.v,exact:ex[a.d]!=null}));D.exact_daily.forEach(e=>{if(!all.some(a=>a.d===e.d))all.push({d:e.d,v:e.v,exact:true})});all.sort((a,b)=>a.d<b.d?-1:1);if(!all.length){document.getElementById('daily').innerHTML='<p class=empty>일별 자료 없음</p>';return}const rows=range==='all'?all:all.slice(-range);const W=900,H=260,L=56,R=12,T=16,B=36;const max=Math.max(...rows.map(r=>r.v))*1.08||1;const x=i=>L+i*(W-L-R)/Math.max(rows.length-1,1);const y=v=>T+(H-T-B)*(1-v/max);

const step=Math.ceil(rows.length/8);rows.forEach((r,i)=>{if(i%step===0||i===rows.length-1)s+=`<text x="${x(i)}" y="${H-10}" fill="#8b93a1" font-size="11" text-anchor="middle">${r.d.slice(5).replace('-','/')}</text>`});

(function(){const a=S.audience||{};const keys=Object.keys(a);if(!keys.length){document.getElementById('donut').innerHTML='<p class=empty>시청자 구성 없음</p>';return}const cols=['#f5c400','#5aa9ff','#3ccf7a'];let s='<svg viewBox="0 0 300 150"><g transform="translate(75,75)">';let acc=0;const R=60,r=38;keys.forEach((k,i)=>{const f=a[k]/100;const a0=acc*2*Math.PI-Math.PI/2,a1=(acc+f)*2*Math.PI-Math.PI/2;acc+=f;const big=f>.5?1:0;const p=(rr,an)=>[rr*Math.cos(an),rr*Math.sin(an)];const [x0,y0]=p(R,a0),[x1,y1]=p(R,a1),[x2,y2]=p(r,a1),[x3,y3]=p(r,a0);s+=`<path d="M${x0},${y0} A${R},${R} 0 ${big} 1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${big} 0 ${x3},${y3}Z" fill="${cols[i]}" data-tip="<b>${k}</b>${a[k]}%"/>`});s+=`<text x="0" y="5" fill="#e8eaee" font-size="14" text-anchor="middle" font-weight="700">신규 ${Math.round(a['신규 시청자']||0)}%</text></g>`;keys.forEach((k,i)=>{s+=`<rect x="160" y="${30+i*28}" width="12" height="12" fill="${cols[i]}"/><text x="180" y="${41+i*28}" fill="#e8eaee" font-size="13">${k} ${a[k]<0.1?'<0.1':a[k]}%</text>`});s+='</svg>';const el=document.getElementById('donut');el.innerHTML=s;bindTips(el)})();

let kind='all',logScale=false;function drawBars(){let rows=vids.filter(v=>kind==='all'||v.kind===kind).slice().sort((a,b)=>a.date<b.date?-1:1);if(!rows.length)return;const W=1200,H=300,L=56,R=12,T=14,B=60;const vals=rows.map(v=>logScale?Math.log10(v.views+1):v.views);const max=Math.max(...vals)*1.06;const bw=(W-L-R)/rows.length;const y=v=>T+(H-T-B)*(1-v/max);let s=`<svg viewBox="0 0 ${W} ${H}">`;for(let g=0;g<=4;g++){const v=max*g/4,yy=y(v);s+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#262c36"/><text x="${L-8}" y="${yy+4}" fill="#8b93a1" font-size="11" text-anchor="end">${logScale?fmt(Math.round(Math.pow(10,v))):fmt(Math.round(v))}</text>`}

(function(){const wk={};vids.forEach(v=>{const d=new Date(v.date);const day=(d.getDay()+6)%7;const mon=new Date(d);mon.setDate(d.getDate()-day);const k=mon.toISOString().slice(0,10);(wk[k]=wk[k]||{n:0,v:0,s:0,l:0});wk[k].n++;wk[k].v+=v.views;wk[k][v.kind==='short'?'s':'l']++});const keys=Object.keys(wk).sort();if(!keys.length)return;const W=600,H=220,L=40,R=40,T=14,B=40;const maxN=Math.max(...keys.map(k=>wk[k].n)),maxV=Math.max(...keys.map(k=>wk[k].v));const bw=(W-L-R)/keys.length;let s=`<svg viewBox="0 0 ${W} ${H}">`;keys.forEach((k,i)=>{const w=wk[k];const h=(H-T-B)*w.n/maxN;s+=`<rect x="${L+i*bw+4}" y="${H-B-h}" width="${bw-8}" height="${h}" fill="#242a34" rx="3" data-tip="<b>${k} 주</b>게시 ${w.n}개 (쇼츠 ${w.s}, 롱폼 ${w.l})<br>누적 조회수 ${num(w.v)}"/><text x="${L+i*bw+bw/2}" y="${H-B+16}" fill="#8b93a1" font-size="10" text-anchor="middle">${k.slice(5).replace('-','/')}</text><text x="${L+i*bw+bw/2}" y="${H-B-h-4}" fill="#e8eaee" font-size="11" text-anchor="middle">${w.n}</text>`});const pts=keys.map((k,i)=>[L+i*bw+bw/2,T+(H-T-B)*(1-wk[k].v/maxV)]);s+=`<path d="M`+pts.map(p=>p.join(',')).join(' L')+`" fill="none" stroke="#f5c400" stroke-width="2"/>`;pts.forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#f5c400"/>`);s+=`<text x="${L}" y="${H-4}" fill="#5c6572" font-size="11">막대 = 주별 게시 수 · 노란 선 = 그 주 게시 영상의 누적 조회수</text></svg>`;const el=document.getElementById('weekly');el.innerHTML=s;bindTips(el)})();
(function(){const h=D.history.filter(x=>x.subs!=null);const el=document.getElementById('hist');if(h.length<2){el.innerHTML='<p class=empty>스냅샷이 '+h.length+'장입니다. 이틀째부터 선이 그려집니다.</p>';return}const W=600,H=200,L=50,R=50,T=14,B=30;const x=i=>L+i*(W-L-R)/(h.length-1);const s0=h.map(o=>o.subs),v0=h.map(o=>o.views);const y1=n=>T+(H-T-B)*(1-(n-Math.min(...s0))/Math.max(Math.max(...s0)-Math.min(...s0),1)),y2=n=>T+(H-T-B)*(1-(n-Math.min(...v0))/Math.max(Math.max(...v0)-Math.min(...v0),1));let s=`<svg viewBox="0 0 ${W} ${H}"><path d="M`+h.map((o,i)=>x(i)+','+y1(o.subs)).join(' L')+`" fill="none" stroke="#3ccf7a" stroke-width="2"/><path d="M`+h.map((o,i)=>x(i)+','+y2(o.views)).join(' L')+`" fill="none" stroke="#f5c400" stroke-width="2"/>`;h.forEach((o,i)=>{s+=`<circle cx="${x(i)}" cy="${y1(o.subs)}" r="3" fill="#3ccf7a" data-tip="<b>${o.d}</b>구독자 ${num(o.subs)}<br>총 조회수 ${num(o.views)}"/><text x="${x(i)}" y="${H-8}" fill="#8b93a1" font-size="10" text-anchor="middle">${o.d.slice(5).replace('-','/')}</text>`});s+=`<text x="${L}" y="12" fill="#3ccf7a" font-size="11">구독자</text><text x="${L+60}" y="12" fill="#f5c400" font-size="11">총 조회수</text></svg>`;el.innerHTML=s;bindTips(el)})();
let tk='all',sortKey='views',sortDir=-1;function drawTable(){const rows=S.videos.filter(v=>tk==='all'||v.kind===tk).map(v=>({...v,gain:gainMap[v.title]??null,cpv:v.comments/Math.max(v.views,1)*1000,durS:(v.dur||'0').split(':').reduce((a,b)=>a*60+ +b,0)}));rows.sort((a,b)=>{const ka=sortKey==='dur'?a.durS:(a[sortKey]??-1),kb=sortKey==='dur'?b.durS:(b[sortKey]??-1);return (ka<kb?-1:ka>kb?1:0)*sortDir});const maxV=Math.max(...rows.map(r=>r.views),1);document.querySelector('#tbl tbody').innerHTML=rows.map(v=>`<tr><td>${v.date||''}</td><td>${esc(v.title)}</td><td><span class="tag ${v.status!=='공개'?'sched':v.kind}">${v.status!=='공개'?'예약':(v.kind==='short'?'쇼츠':'롱폼')}</span></td><td class=n>${v.dur||''}</td><td class=n>${num(v.views)}</td><td class="n ${cls(v.gain)}">${v.gain==null?'—':sign(v.gain)}</td><td class=n>${num(v.comments)}</td><td class=n>${v.cpv.toFixed(1)}</td><td style="min-width:120px"><div class=bar><i style="width:${v.views/maxV*100}%"></i></div></td></tr>`).join('');document.querySelectorAll('#tbl th').forEach(th=>th.classList.toggle('on',th.dataset.s===sortKey))}
